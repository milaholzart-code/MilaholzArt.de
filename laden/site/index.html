<style>
/* Layout: Vollbild-Fotoszenen (16:9, cover) mit Hotspots; Kopfzeile oben, Bereichsleiste unten, Info-Schublade rechts */
:root{

  --bg:#0f0d0b;
  --panel:#16130f;
  --panel-2:#221d17;
  --fg:#f3ece0;
  --muted:#b0a38f;
  --gold:#c9a45c;
  --gold-2:#e2c27f;
  --paper:#efe5d2;
  --ink:#2b2119;
  --line:rgba(243,236,224,.14);
  --f-display:"Cormorant Garamond", Garamond, Georgia, serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Szenen */
#view{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.scene.on{opacity:1;visibility:visible}
.pan{position:absolute;left:0;top:0;will-change:transform}
.zoom{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity}
.canvas{position:absolute;inset:0;container-type:inline-size}
.canvas img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)}

/* Hotspots */
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.hs .dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#15110d;display:grid;place-items:center;font-size:15px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.45);position:relative;flex:none;transition:transform .2s,background .2s}
.hs .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);animation:ring 2.6s ease-out infinite}
.hs.go .dot{background:var(--gold);color:#1a130a}
.hs .lab{background:rgba(18,15,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:12.5px;white-space:nowrap;transition:background .2s}
.hs.left{flex-direction:row-reverse}
.hs:hover .dot,.hs:focus-visible .dot{transform:scale(1.12)}
.hs:hover .lab{background:rgba(18,15,12,.95)}
.hs.big .dot{width:46px;height:46px;font-size:20px}
.hs.big .lab{font-size:15px;padding:9px 16px;font-weight:600}
@keyframes ring{0%{transform:scale(.8);opacity:.9}80%,100%{transform:scale(1.5);opacity:0}}
.area{position:absolute;cursor:pointer;z-index:1;border-radius:12px}

/* Ordner-Etiketten auf echten Ordnerrücken */
.spine{position:absolute;transform:translate(-50%,-50%);writing-mode:vertical-rl;transform:translate(-50%,-50%) rotate(180deg);background:#f1e7d2;color:#2b2119;font-family:var(--f-body);font-weight:600;font-size:max(9px,.78cqw);letter-spacing:.04em;padding:.5cqw .25cqw;border:0;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.4),0 0 0 0 rgba(201,164,92,0);opacity:.95;white-space:nowrap;cursor:pointer;z-index:2;transition:transform .25s,box-shadow .25s}
.spine:hover,.spine:focus-visible{transform:translate(-50%,-58%) rotate(180deg);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 0 3px rgba(201,164,92,.85)}

/* Kopfzeile */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:10;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(201,164,92,.6),0 4px 14px rgba(0,0,0,.5)}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.06em;line-height:1}
.brand small{display:block;color:var(--gold-2);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.top .chip{pointer-events:auto;background:rgba(18,15,12,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.top .chip:hover{border-color:var(--gold)}

/* Szenentitel */
.caption{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:9;text-align:right;pointer-events:none;max-width:min(440px,70vw)}
.caption::before{content:"";position:absolute;inset:-60px -40px -50px -120px;background:radial-gradient(closest-side,rgba(8,6,4,.62),rgba(8,6,4,0));z-index:-1}
.caption .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2)}
.caption h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.4vw,52px);line-height:1;margin:6px 0 6px;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.caption p{margin:0;color:#e6dccb;font-size:14px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.caption.swap{animation:capIn .8s ease both}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Bereichsleiste */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.hint{font-size:12px;color:#e6dccb;background:rgba(10,8,6,.55);padding:5px 12px;border-radius:999px;text-align:center}
.tabs{display:flex;gap:3px;background:rgba(18,15,12,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:5px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--gold);color:#1a130a;font-weight:600}

/* CNC-Karte beim Überfahren */
#card{position:fixed;z-index:12;width:300px;max-width:calc(100vw - 32px);background:rgba(16,13,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(201,164,92,.45);border-radius:14px;padding:16px 18px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#card.show{opacity:1;transform:none}
#card .e{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2)}
#card h3{font-family:var(--f-display);font-weight:600;font-size:24px;margin:4px 0 10px;line-height:1.05}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:12.5px}
#card dt{color:var(--muted)}
#card dd{margin:0;font-family:var(--f-mono);font-size:12px}
#card .f{margin-top:10px;font-size:12px;color:var(--muted)}

/* Info-Schublade */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:20;background:var(--panel);border-left:1px solid var(--line);transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
#panel.open{transform:none}
.p-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 6px}
.p-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2)}
.p-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:19px;line-height:1}
.p-body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 28px}
.gal{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.gal .main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--panel-2);display:block}
.gal .thumbs{display:flex;gap:6px}
.gal .thumbs button{flex:1;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:none;max-width:25%}
.gal .thumbs button.on{border-color:var(--gold)}
.gal .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.p-body h2{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.02;margin:4px 0 12px;text-wrap:balance}
.p-body p{line-height:1.6;color:#e2d8c7;margin:0 0 14px;max-width:62ch}
.specs{display:grid;grid-template-columns:minmax(96px,auto) 1fr;border-top:1px solid var(--line);margin:4px 0 18px}
.specs div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.specs .k{color:var(--muted);padding-right:14px}

.price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-radius:12px;background:var(--panel-2);margin-bottom:14px}
.price span{color:var(--muted);font-size:12.5px}
.price b{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--gold-2);white-space:nowrap}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px 16px;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg)}
.btn.primary{background:var(--gold);color:#1a130a;border-color:transparent}
.btn:hover{filter:brightness(1.07)}
.copyline{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;user-select:all}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 22px 24px 36px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(43,33,25,.09) 27px 28px);box-shadow:0 10px 30px rgba(0,0,0,.4);margin-bottom:16px}
.paper::before{content:"";position:absolute;left:18px;top:0;bottom:0;border-left:2px solid rgba(176,70,50,.35)}
.paper h3{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 10px;color:var(--ink)}
.paper p,.paper li{color:#3a2d22;line-height:1.7;font-size:14.5px}
.paper ol,.paper ul{padding-left:20px;margin:0 0 10px}
.paper .small{font-size:12.5px;color:#6a5846}
.paper .mono{font-family:var(--f-mono);font-size:12.5px}
.paper img.founder{width:110px;height:130px;object-fit:cover;border-radius:4px;float:right;margin:0 0 8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.faq dt{font-weight:600;color:#2b2119;margin-top:10px}
.faq dd{margin:2px 0 0;color:#3a2d22;line-height:1.6;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{padding:0;border:0;background:none;cursor:pointer;border-radius:6px;overflow:hidden}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}

#loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .8s}
#loader.gone{opacity:0;pointer-events:none}
#loader div{display:flex;flex-direction:column;align-items:center;gap:14px}
#loader img{width:84px;height:84px;border-radius:50%;object-fit:cover}
#loader span{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

@media (max-width:640px){
  .hs .lab{display:none}
  .hs.big .lab{display:block}
  .caption{left:16px;right:16px;text-align:left;top:calc(env(safe-area-inset-top,0px) + 70px)}
  .caption p{display:none}
  .brand b{font-size:18px}
  .top .chip{display:none}
  #panel{top:auto;height:84%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  #card{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hs .dot::after{animation:none}
  .caption.swap{animation:none}
}

  aussen:{img:'img/aussen.jpg',tab:'Draußen',e:'Hameln · Altstadt',h:'Holzkunst aus Hameln',p:'Der Laden hat geöffnet. Treten Sie ein.',hint:'Klicken Sie auf die Tür',start:[50,45],
    hs:[{x:50,y:52,t:'go',to:'innen',l:'Laden betreten',big:true},{x:27,y:24,t:'info',id:'ueber',l:'Über Milaholz Art'}]},
  innen:{img:'img/innen.jpg',tab:'Im Laden',e:'Rundgang',h:'Schauen Sie sich um',p:'Tippen Sie auf einen Bereich, um näher heranzugehen.',hint:'Ziehen zum Umsehen · Punkte antippen',start:[45,50],
    hs:[{x:9,y:22,t:'go',to:'wand',l:'Uhren & Wandbilder'},{x:42,y:78,t:'go',to:'tisch',l:'Geschenke-Tisch'},{x:44,y:27,t:'item',id:'namen',l:'Namens- & Familienschilder'},{x:80,y:36,t:'go',to:'werkstatt',l:'Zur Werkstatt',left:true},{x:79,y:70,t:'go',to:'buero',l:'Kasse · weiter ins Büro',left:true}]},
  wand:{img:'img/wand.jpg',tab:'Wand',e:'Wohnen & Wanddeko',h:'Uhren, Wandbilder, Namen',p:'Jedes Stück wird in der Werkstatt nebenan gefertigt.',hint:'Punkte antippen für Details',start:[50,45],mstart:[24,45],
    hs:[{x:22,y:27,t:'item',id:'wanduhren',l:'Wanduhren'},{x:66,y:30,t:'item',id:'wandkunst',l:'3D-Wandbilder'},{x:86,y:46,t:'item',id:'wandkunst',l:'Blattmuster',left:true},{x:24,y:48,t:'item',id:'namen',l:'Namensbuchstaben'},{x:51,y:74,t:'item',id:'gravur',l:'Holzbilder mit Gravur'},{x:26,y:79,t:'item',id:'untersetzer',l:'Untersetzer'}]},
  tisch:{img:'img/tisch.jpg',tab:'Geschenke',e:'Kleine Dinge, große Freude',h:'Der Geschenke-Tisch',p:'Untersetzer, Anhänger und Bretter, alle mit Gravur nach Wunsch.',hint:'Punkte antippen für Details',start:[50,55],
    hs:[{x:30,y:52,t:'item',id:'untersetzer',l:'Untersetzer mit Gravur'},{x:48,y:72,t:'item',id:'epoxid',l:'Holz & Harz'},{x:60,y:36,t:'item',id:'schluessel',l:'Schlüsselanhänger'},{x:88,y:42,t:'item',id:'schneidebrett',l:'Schneidebrett',left:true},{x:76,y:86,t:'item',id:'servier',l:'Servierbrett „River“',left:true}]},
  werkstatt:{img:'img/werkstatt.jpg',tab:'Werkstatt',e:'Hinter der Glaswand',h:'Hier entsteht jedes Stück',p:'Fahren Sie mit der Maus über die Maschine.',hint:'Maschine berühren oder antippen',start:[48,50],
    area:{x:27,y:42,w:62,h:34,id:'cnc'},
    hs:[{x:55,y:57,t:'cnc',l:'CNC-Fräse & Laser'},{x:84,y:46,t:'info',id:'auftrag',l:'So entsteht Ihr Stück',left:true},{x:66,y:12,t:'go',to:'wand',l:'Fertige Stücke'}]},
  buero:{img:'img/buero.jpg',tab:'Büro',e:'Ordner & Infos',h:'Alles Wichtige in den Ordnern',p:'Ziehen Sie einen Ordner heraus.',hint:'Etikett auf einem Ordner antippen',start:[62,45],mstart:[76,50],
    spines:[{x:66,y:52,k:'ueber'},{x:69.6,y:52,k:'leistungen'},{x:73.2,y:52,k:'auftrag'},{x:76.9,y:52,k:'faq'},{x:80.9,y:52,k:'kontakt'},{x:85.4,y:52,k:'arbeiten'}],
    hs:[{x:47,y:30,t:'gallery',l:'Pinnwand: Arbeiten'}]},
};
const ORDER=['aussen','innen','wand','tisch','werkstatt','buero'];

/* ============ Aufbau ============ */
const view=document.getElementById('view');
const S={};
const icon={go:'→',item:'+',info:'i',cnc:'+',gallery:'+'};
ORDER.forEach(k=>{
  const sc=SCENES[k];
  const el=document.createElement('section');el.className='scene';el.dataset.k=k;
  el.innerHTML=`<div class="pan"><div class="zoom"><div class="canvas"><img class="bg" src="${sc.img}" alt="" draggable="false"></div><div class="vignette"></div></div></div>`;
  const cv=el.querySelector('.canvas');
  if(sc.area){const a=document.createElement('div');a.className='area';Object.assign(a.style,{left:sc.area.x+'%',top:sc.area.y+'%',width:sc.area.w+'%',height:sc.area.h+'%'});a.dataset.cnc='1';cv.appendChild(a);}
  (sc.spines||[]).forEach(s=>{const d=document.createElement('button');d.className='spine';d.style.left=s.x+'%';d.style.top=s.y+'%';d.textContent=BINDERS[s.k].label;d.setAttribute('aria-label','Ordner '+BINDERS[s.k].label+' öffnen');
    d.addEventListener('click',e=>{e.stopPropagation();s.k==='arbeiten'?openGallery():openBinder(s.k);});cv.appendChild(d);});
  sc.hs.forEach(h=>{
    const b=document.createElement('button');b.className=`hs ${h.t==='go'?'go':''} ${h.left?'left':''} ${h.big?'big':''}`;
    b.style.left=h.x+'%';b.style.top=h.y+'%';
    b.innerHTML=`<span class="dot" aria-hidden="true">${icon[h.t]}</span><span class="lab">${h.l}</span>`;
    b.setAttribute('aria-label',h.l);
    b.addEventListener('click',e=>{e.stopPropagation();act(h,k);});
    if(h.t==='cnc'){b.addEventListener('mouseenter',()=>showCard(b));b.addEventListener('mouseleave',hideCard);}
    cv.appendChild(b);
  });
  view.appendChild(el);
  S[k]={el,pan:el.querySelector('.pan'),zoom:el.querySelector('.zoom'),px:0,py:0,tx:0,ty:0};
});
// CNC-Fläche
document.querySelectorAll('.area').forEach(a=>{
  a.addEventListener('mouseenter',()=>showCard(a));a.addEventListener('mouseleave',hideCard);
  a.addEventListener('click',e=>{e.stopPropagation();openCNC();});
});

const tabs=document.getElementById('tabs');
ORDER.forEach(k=>{const b=document.createElement('button');b.textContent=SCENES[k].tab;b.dataset.k=k;b.addEventListener('click',()=>go(k));tabs.appendChild(b);});

/* ============ Geometrie & Schwenken ============ */
let W=innerWidth,H=innerHeight,cw,ch;
const MARGIN=1.08;
function layout(){
  W=innerWidth;H=innerHeight;
  cw=Math.max(W,H*16/9)*MARGIN;ch=cw*9/16;
  if(ch<H*MARGIN){ch=H*MARGIN;cw=ch*16/9;}
  for(const k in S){S[k].pan.style.width=cw+'px';S[k].pan.style.height=ch+'px';}
}
function limits(){return {mx:(cw-W)/2,my:(ch-H)/2};}
function centerOn(k,fx,fy){
  const {mx,my}=limits();const s=S[k];
  s.tx=s.px=clamp((50-fx)/100*cw,-mx,mx);s.ty=s.py=clamp((50-fy)/100*ch,-my,my);
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyPan(k){const s=S[k];const {mx,my}=limits();s.pan.style.transform=`translate(${(W-cw)/2+s.px}px,${(H-ch)/2+s.py}px)`;}

let cur=null, busy=false, pending=null;
const isTouch=matchMedia('(hover: none)').matches;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// Maus-Parallaxe (Desktop)
let base={x:0,y:0};
view.addEventListener('mousemove',e=>{
  if(isTouch||drag)return;const s=S[cur];if(!s)return;
  const {mx,my}=limits();
  const nx=e.clientX/W-.5, ny=e.clientY/H-.5;
  s.tx=clamp(base.x-nx*mx*1.6,-mx,mx);s.ty=clamp(base.y-ny*my*1.6,-my,my);
});
// Ziehen (Touch und Maus)
let drag=null;
view.addEventListener('pointerdown',e=>{if(e.target.closest('.hs'))return;drag={x:e.clientX,y:e.clientY,px:S[cur].px,py:S[cur].py,moved:false};view.classList.add('dragging');});
addEventListener('pointermove',e=>{
  if(!drag)return;const s=S[cur];const {mx,my}=limits();
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  s.tx=s.px=clamp(drag.px+dx,-mx,mx);s.ty=s.py=clamp(drag.py+dy,-my,my);
});
addEventListener('pointerup',()=>{if(drag&&cur){base.x=S[cur].px;base.y=S[cur].py;}drag=null;view.classList.remove('dragging');});

function tick(){
  const s=S[cur];
  if(s){s.px+=(s.tx-s.px)*.08;s.py+=(s.ty-s.py)*.08;applyPan(cur);}
  requestAnimationFrame(tick);
}

/* ============ Szenenwechsel ============ */
const cap=document.getElementById('cap');
function setCaption(k){
  const sc=SCENES[k];
  document.getElementById('capE').textContent=sc.e;document.getElementById('capH').textContent=sc.h;document.getElementById('capP').textContent=sc.p;
  document.getElementById('hint').textContent=isTouch?'Wischen zum Umsehen · '+sc.hint.replace('Ziehen zum Umsehen · ',''):sc.hint;
  cap.classList.remove('swap');void cap.offsetWidth;cap.classList.add('swap');
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  try{history.replaceState(null,'','#'+k);}catch(e){}
}
function go(k,focus){
  if(busy){if(k!==cur)pending=[k,focus];return;}
  if(k===cur||!S[k])return;
  closePanel();hideCard();
  const from=cur?S[cur]:null, to=S[k];
  const fwd=!from||ORDER.indexOf(k)>ORDER.indexOf(cur)||(focus!=null);
  centerOn(k,...((isTouch&&SCENES[k].mstart)||SCENES[k].start));base={x:to.px,y:to.py};applyPan(k);
  to.el.classList.add('on');to.el.style.zIndex=2;if(from)from.el.style.zIndex=1;
  setCaption(k);
  if(!from||reduce){if(from)from.el.classList.remove('on');cur=k;return;}
  busy=true;
  const dur=1300;
  if(focus){from.zoom.style.transformOrigin=`${focus[0]}% ${focus[1]}%`;}
  else from.zoom.style.transformOrigin='50% 50%';
  from.zoom.animate([{transform:'scale(1)',opacity:1,filter:'blur(0px)'},{transform:`scale(${fwd?2.1:.88})`,opacity:0,filter:'blur(3px)'}],{duration:dur,easing:'cubic-bezier(.55,.05,.35,1)',fill:'forwards'});
  const a=to.zoom.animate([{transform:`scale(${fwd?1.18:1.25})`,opacity:0},{transform:'scale(1)',opacity:1}],{duration:dur,easing:'cubic-bezier(.3,.6,.25,1)',delay:dur*.25,fill:'both'});
  cur=k;
  a.onfinish=()=>{from.el.classList.remove('on');from.zoom.getAnimations().forEach(x=>x.cancel());to.zoom.getAnimations().forEach(x=>x.cancel());busy=false;
    if(pending){const [pk,pf]=pending;pending=null;go(pk,pf);}};
}
function act(h,k){
  if(drag&&drag.moved)return;
  if(h.t==='go')return go(h.to,[h.x,h.y]);
  if(h.t==='item')return openItem(h.id);
  if(h.t==='info')return openBinder(h.id);
  if(h.t==='cnc')return openCNC();
  if(h.t==='gallery')return openGallery();
}

/* ============ CNC-Karte ============ */
const card=document.getElementById('card');
card.innerHTML=`<div class="e">${CNC.cat}</div><h3>${CNC.name}</h3><dl>${CNC.specs.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl><div class="f">Klicken für mehr</div>`;
function showCard(el){
  if(isTouch)return;
  const r=el.getBoundingClientRect();
  let x=r.left+r.width/2+20,y=r.top+20;
  x=Math.min(x,W-card.offsetWidth-16);y=Math.min(Math.max(80,y),H-card.offsetHeight-90);
  card.style.left=x+'px';card.style.top=y+'px';card.classList.add('show');
}
function hideCard(){card.classList.remove('show');}

/* ============ Schublade ============ */
const panel=document.getElementById('panel'),pB=document.getElementById('pB'),pE=document.getElementById('pE');
document.getElementById('pX').addEventListener('click',closePanel);
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
function closePanel(){panel.classList.remove('open');}
function contact(subject){
  return `<div class="actions"><a class="btn primary" href="${wa('Hallo Milaholz Art, ich interessiere mich für: '+subject)}" target="_blank" rel="noopener">Per WhatsApp anfragen</a>
  <button class="btn" data-copy="${CONTACT.mail}">E-Mail-Adresse kopieren</button><div class="copyline">${CONTACT.mail} · ${CONTACT.phone}</div></div>`;
}
function gallery(photos){
  if(!photos.length)return'';
  return `<div class="gal"><img class="main" src="p/${photos[0]}.jpg" alt="">${photos.length>1?`<div class="thumbs">${photos.map((p,i)=>`<button class="${i?'':'on'}" data-p="${p}"><img src="p/${p}.jpg" alt=""></button>`).join('')}</div>`:''}</div>`;
}
function sceneCrop(sc){ // Ausschnitt aus der Szene als Bild
  const [k,x,y]=sc;return `<div class="gal"><div class="main" style="background:url(${SCENES[k].img}) ${x}% ${y}%/320% auto no-repeat"></div></div>`;
}
function open(eyebrow,html){pE.textContent=eyebrow;pB.innerHTML=html;pB.scrollTop=0;panel.classList.add('open');hideCard();}
function openItem(id){
  const it=ITEMS[id];
  open(it.cat,`${it.photos.length?gallery(it.photos):sceneCrop(it.scene)}<h2>${it.name}</h2><p>${it.desc}</p>
    <div class="specs">${it.specs.map(([a,b])=>`<div class="k">${a}</div><div class="v">${b}</div>`).join('')}</div>
    <div class="price"><span>Richtpreis</span><b>${it.price}</b></div>${contact(it.name)}`);
}
function openCNC(){
  open(CNC.cat,`${gallery(['cnc'])}<h2>${CNC.name}</h2><p>${CNC.desc}</p>
    <div class="specs">${CNC.specs.map(([a,b])=>`<div class="k">${a}</div><div class="v">${b}</div>`).join('')}</div>
    <p>Sie haben eine Idee für ein Schild, Relief oder eine Gravur? Schicken Sie eine Skizze oder ein Foto.</p>${contact('eine Anfertigung mit CNC und Laser')}`);
}
function openBinder(k){
  const b=BINDERS[k];
  open('Ordner · '+b.label,`<div class="paper">${b.html}</div>${['kontakt','auftrag'].includes(k)?contact('eine Maßanfertigung'):''}`);
}
function openGallery(){
  open('Pinnwand',`<h2>Arbeiten aus der Werkstatt</h2><p>Eine Auswahl unserer Stücke. Tippen Sie auf ein Bild, um es groß zu sehen.</p>
    <div class="gal"><img class="main" src="p/${allPhotos[0]}.jpg" alt=""></div><div class="grid">${allPhotos.map(p=>`<button data-p="${p}"><img src="p/${p}.jpg" alt=""></button>`).join('')}</div><div style="height:16px"></div>${contact('ein Stück von der Pinnwand')}`);
}
pB.addEventListener('click',async e=>{
  const t=e.target.closest('[data-p]');
  if(t){const m=pB.querySelector('.main');if(m&&m.tagName==='IMG')m.src=`p/${t.dataset.p}.jpg`;pB.querySelectorAll('.thumbs button').forEach(b=>b.classList.toggle('on',b===t));if(t.closest('.grid'))m.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  const c=e.target.closest('[data-copy]');if(!c)return;
  try{await navigator.clipboard.writeText(c.dataset.copy);c.textContent='Kopiert';}
  catch(err){const l=pB.querySelector('.copyline');if(l){const r=document.createRange();r.selectNodeContents(l);const s=getSelection();s.removeAllRanges();s.addRange(r);}c.textContent='Adresse markiert, bitte kopieren';}
  setTimeout(()=>c.textContent='E-Mail-Adresse kopieren',2200);
});

/* ============ Start ============ */
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(SCENES[k]&&k!==cur)go(k);});
addEventListener('resize',()=>{layout();if(cur){const s=S[cur];const {mx,my}=limits();s.tx=s.px=clamp(s.px,-mx,mx);s.ty=s.py=clamp(s.py,-my,my);}});
layout();
const startK=(location.hash||'').slice(1);
const first=SCENES[startK]?startK:'aussen';
const pre=new Image();pre.src=SCENES[first].img;
let started=false;
const done=()=>{if(started)return;started=true;go(first);document.getElementById('loader').classList.add('gone');requestAnimationFrame(tick);
  ORDER.forEach(k=>{const i=new Image();i.src=SCENES[k].img;});};
pre.decode?pre.decode().then(done,done):(pre.onload=done);
setTimeout(()=>{if(!cur)done();},4000);
</script>
